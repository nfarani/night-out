<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#161513">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#161513; --text:#efe9de; --text-2:#aaa398; --line:#2c2a26; --route:#f5c84b; --display:"Barlow Condensed",sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:400 16px/26px Inter,system-ui,sans-serif; }
  a{ color:var(--route); }
  .top{ display:flex; align-items:center; height:64px; padding:0 20px; border-bottom:1px solid var(--line); }
  .logo{ display:flex; align-items:center; gap:8px; font:600 22px/1 var(--display); color:var(--text); text-decoration:none; }
  .logo img{ width:28px; height:28px; }
  main{ max-width:44rem; margin:0 auto; padding:40px 20px 64px; }
  h1{ font:600 44px/1.05 var(--display); margin:0 0 16px; }
  h2{ font:600 26px/1.2 var(--display); margin:32px 0 8px; }
  p, li{ color:var(--text-2); }
  .cta{ display:inline-block; margin-top:24px; padding:14px 22px; border-radius:999px; background:var(--route); color:#1a1508; font-weight:600; text-decoration:none; }
</style>
<meta name="robots" content="noindex">
<title>Page not found · Owlabout</title>
</head>
<body>
<header class="top"><a class="logo" href="/"><img src="/icon.svg" alt="">Owlabout</a></header>
<main>
  <h1>Wrong turn</h1>
  <p>There’s nothing at this address. If someone sent you a plan, the link may have been cut off when it was copied.</p>
  <a class="cta" href="/">Plan a night</a>
</main>
</body>
</html>
